<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppgift 3: Change content</title>
    <style>
      .recipe {
        display: none;
      }
    </style>
  </head>
  <body>
    <button onclick="showCarbonara()">Show carbonara ingredients</button>
    <button onclick="showPizza()">Show pizza ingredients</button>

    <div id="ingredients"></div>

    <script>
      // TODO: Skapa funktionerna showCarbonara() och showPizza() för att visa ingredienserna för respektive recept i diven ingredients
      
  function showCarbonara() {
    document.getElementById("ingredients").innerHTML =
      "<h2>Carbonara ingredienser</h2>" +
      "<ul>" +
      "<li>Pasta</li>" +
      "<li>Bacon</li>" +
      "<li>Ägg</li>" +
      "<li>Parmesanost</li>" +
      "</ul>";
  }

  function showPizza() {
    document.getElementById("ingredients").innerHTML =
      "<h2>Pizza ingredienser</h2>" +
      "<ul>" +
      "<li>Pizzadeg</li>" +
      "<li>Tomatsås</li>" +
      "<li>Ost</li>" +
      "<li>Skinka</li>" +
      "</ul>";
  }
  
</script>


    </script>
  </body>
</html>
