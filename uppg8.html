<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppgift 8: Onward</title>
</head>

<body>

    <h1>Loopar och If-satser</h1>

    <p id="output"></p>

    <script>

        let output = document.getElementById("output");

        // loop från 1 till 10
        for(let i = 1; i <= 10; i++) {

            // if-sats
            if(i % 2 === 0) {
                output.innerHTML += i + " är ett jämnt tal <br>";
            } else {
                output.innerHTML += i + " är ett udda tal <br>";
            }

        }

    </script>

</body>
</html>
